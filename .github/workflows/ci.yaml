name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy homeassistant==2026.5.0
          
      - name: Lint with ruff
        run: |
          ruff check custom_components/comelit_intercom tests
          
      - name: Check formatting with black
        run: |
          black --check custom_components/comelit_intercom tests
          
      - name: Check import order with isort
        run: |
          isort --check-only custom_components/comelit_intercom tests

      - name: Type check with mypy
        run: mypy custom_components/comelit_intercom

      - name: Check dashboard JavaScript
        run: node --check custom_components/comelit_intercom/www/comelit-intercom-card.js

  hassfest:
    runs-on: ubuntu-latest
    name: Hassfest Validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    name: Run tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant==2026.5.0 pytest pytest-asyncio pytest-cov PyTurboJPEG==1.8.3 av==16.0.1 numpy==2.3.2
          
      - name: Test with pytest
        run: pytest -q
